<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VK → Spotify</title>
    <style>
        body {
            width: 360px;
            height: 110px;
            margin: 0;
            background-color: #121212;
            border-radius: 5px;
            font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
            color: #fff;
        }
        .popup {
            display: flex;
            gap: 12px;
            align-items: center;
            padding: 12px;
        }
        .cover {
            width: 80px;
            height: 80px;
            border-radius: 6px;
            object-fit: cover;
            background-color: #282828;
            flex-shrink: 0;
        }
        .meta {
            min-width: 0;
            flex: 1;
        }
        h1 {
            margin: 0 0 4px;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        h2 {
            margin: 0 0 10px;
            font-size: 11px;
            font-weight: 400;
            color: #b3b3b3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .spotify-mark {
            width: 22px;
            height: 22px;
        }
        button {
            background-color: #1db954;
            border: none;
            border-radius: 5px;
            color: #000;
            font-size: 11px;
            font-weight: 600;
            padding: 5px 14px;
            cursor: pointer;
        }
        button:disabled {
            opacity: 0.5;
            cursor: default;
        }
        button:hover:enabled {
            background-color: #1ed760;
        }
    </style>
</head>
<body>
    <div class="popup">
        <img class="cover" id="Image_of_albom" src="Icons/spotify-48.png" alt="Album cover">
        <div class="meta">
            <h1 id="name_of_track">No track selected</h1>
            <h2 id="artist_of_track">Right-click a track on VK</h2>
            <div class="actions">
                <img class="spotify-mark" src="Icons/spotify-48.png" alt="Spotify">
                <button id="save" disabled>Save</button>
            </div>
        </div>
    </div>
    <script src="music-script.js"></script>
</body>
</html>
